<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIXEL MINI GAME - Iseng bikin wkwk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<main class="game">
  <header class="title">
    <h1>PIXEL MINI GAME</h1>
    <p>Iseng bikin wkwk</p>
  </header>

  <section class="stage pix" aria-label="Karakter">
    <div class="bubble pix" id="bubble" aria-live="polite">Hai! Siap jadi stylist?</div>
    <div id="doll" role="img" aria-label="Karakter chibi"></div>
    <div class="floor"></div>
    <div class="actions">
      <button class="btn" id="randomBtn">Randomize</button>
      <button class="btn alt" id="resetBtn">Reset</button>
      <button class="btn go" id="finishBtn">Finish Look</button>
    </div>
  </section>

  <section class="panel pix" aria-label="Menu makeover">
    <nav class="cats" id="cats"></nav>
    <nav class="subs" id="subs"></nav>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div class="overlay" id="result" hidden>
  <div class="card pix" role="dialog" aria-modal="true" aria-labelledby="lookName">
    <p class="kicker">Look selesai!</p>
    <div id="finalDoll" role="img" aria-label="Hasil akhir"></div>
    <h2 id="lookName"></h2>
    <p id="lookDesc"></p>
    <p class="stars" id="lookStars"></p>
    <div class="actions">
      <button class="btn alt" id="keepBtn">Lanjut Styling</button>
      <button class="btn go" id="againBtn">Play Again</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
